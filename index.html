<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AST-aware TypeScript teaching debugger web component"
    />
    <title>TypeScript Teaching Debugger</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #111315;
        color: #e8eaed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% -20%, #263244 0, transparent 48%),
          #111315;
      }

      main {
        width: min(1440px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .intro {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 20px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #8ab4f8;
        font: 600 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 38px);
        font-weight: 520;
        letter-spacing: -0.035em;
      }

      .intro p:last-child {
        max-width: 520px;
        margin: 0;
        color: #9aa0a6;
        font-size: 14px;
        line-height: 1.55;
      }

      ts-teaching-debugger {
        display: block;
        height: min(760px, calc(100vh - 160px));
        min-height: 540px;
      }

      @media (max-width: 760px) {
        main {
          width: 100%;
          padding: 20px 12px;
        }

        .intro {
          align-items: flex-start;
          flex-direction: column;
        }

        ts-teaching-debugger {
          height: 820px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <div>
          <p class="eyebrow">Interactive lesson</p>
          <h1>Follow the runtime, not a diagram.</h1>
        </div>
        <p>
          Step through TypeScript by executable AST node. Inspect each frame,
          watch values change, and use the same mental model as a browser
          debugger.
        </p>
      </header>
      <ts-teaching-debugger id="debugger"></ts-teaching-debugger>
    </main>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
