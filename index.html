<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AST-aware TypeScript teaching debugger web component"
    />
    <title>TypeScript Teaching Debugger</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #111315;
        color: #e8eaed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% -20%, #263244 0, transparent 48%),
          #111315;
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      main {
        width: min(1500px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .intro {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 20px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #8ab4f8;
        font: 600 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 4vw, 38px);
        font-weight: 520;
        letter-spacing: -0.035em;
      }

      .intro p:last-child {
        max-width: 520px;
        margin: 0;
        color: #9aa0a6;
        font-size: 14px;
        line-height: 1.55;
      }

      .algorithm-layout {
        display: grid;
        gap: 16px;
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .example-browser,
      .lesson-context {
        background: rgba(32, 33, 36, 0.88);
        border: 1px solid #3c4043;
        border-radius: 10px;
      }

      .example-browser {
        display: flex;
        flex-direction: column;
        height: min(820px, calc(100vh - 160px));
        min-height: 620px;
        overflow: hidden;
      }

      .browser-heading {
        align-items: center;
        border-bottom: 1px solid #3c4043;
        display: flex;
        justify-content: space-between;
        padding: 14px 15px 12px;
      }

      .browser-heading h2 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }

      .example-count {
        background: rgba(138, 180, 248, 0.12);
        border-radius: 999px;
        color: #8ab4f8;
        font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 5px 7px;
      }

      .search-wrap {
        padding: 10px;
      }

      .example-search {
        background: #292a2d;
        border: 1px solid #4b4f52;
        border-radius: 6px;
        color: #e8eaed;
        font-size: 12px;
        outline: none;
        padding: 9px 10px;
        width: 100%;
      }

      .example-search:focus {
        border-color: #8ab4f8;
        box-shadow: 0 0 0 2px rgba(138, 180, 248, 0.15);
      }

      .category-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        padding: 0 10px 10px;
      }

      .category-button {
        background: transparent;
        border: 1px solid #4b4f52;
        border-radius: 999px;
        color: #bdc1c6;
        cursor: pointer;
        font-size: 10px;
        padding: 5px 8px;
      }

      .category-button:hover,
      .category-button[aria-pressed="true"] {
        background: rgba(138, 180, 248, 0.12);
        border-color: #8ab4f8;
        color: #8ab4f8;
      }

      .example-list {
        border-top: 1px solid #303134;
        flex: 1;
        overflow-y: auto;
        padding: 6px;
      }

      .example-button {
        background: transparent;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        display: block;
        padding: 10px;
        text-align: left;
        width: 100%;
      }

      .example-button:hover {
        background: rgba(232, 234, 237, 0.06);
      }

      .example-button[aria-current="true"] {
        background: rgba(138, 180, 248, 0.12);
        box-shadow: inset 3px 0 0 #8ab4f8;
      }

      .example-title {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .example-summary {
        color: #9aa0a6;
        display: block;
        font-size: 10px;
        line-height: 1.45;
      }

      .example-complexity {
        color: #8ab4f8;
        display: block;
        font: 9px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        margin-top: 5px;
      }

      .lesson-panel {
        min-width: 0;
      }

      .lesson-context {
        align-items: center;
        display: flex;
        gap: 18px;
        justify-content: space-between;
        margin-bottom: 10px;
        padding: 11px 14px;
      }

      .lesson-category {
        color: #8ab4f8;
        font: 600 9px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
        margin: 0 0 3px;
        text-transform: uppercase;
      }

      .lesson-title {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 2px;
      }

      .lesson-description {
        color: #9aa0a6;
        font-size: 11px;
        margin: 0;
      }

      .complexity-group {
        display: flex;
        flex-shrink: 0;
        gap: 7px;
      }

      .complexity-badge {
        background: #292a2d;
        border: 1px solid #3c4043;
        border-radius: 5px;
        color: #bdc1c6;
        font: 9px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 5px 7px;
      }

      ts-teaching-debugger {
        display: block;
        height: min(750px, calc(100vh - 230px));
        min-height: 540px;
      }

      @media (max-width: 900px) {
        main {
          width: 100%;
          padding: 20px 12px;
        }

        .intro {
          align-items: flex-start;
          flex-direction: column;
        }

        .algorithm-layout {
          grid-template-columns: 1fr;
        }

        .example-browser {
          height: auto;
          min-height: 0;
        }

        .example-list {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
          max-height: 260px;
        }

        ts-teaching-debugger {
          height: 820px;
        }
      }

      @media (max-width: 560px) {
        .lesson-context {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <div>
          <p class="eyebrow">Algorithm execution lab</p>
          <h1>Learn algorithms from the runtime.</h1>
        </div>
        <p>
          Choose a computer science algorithm, then step through its TypeScript
          by executable AST node while scopes and call frames update live.
        </p>
      </header>
      <div class="algorithm-layout">
        <aside class="example-browser" aria-label="Algorithm examples">
          <div class="browser-heading">
            <h2>Algorithm library</h2>
            <span class="example-count" id="example-count">0</span>
          </div>
          <div class="search-wrap">
            <label for="example-search" class="eyebrow">Find an example</label>
            <input
              class="example-search"
              id="example-search"
              type="search"
              placeholder="Search algorithms"
              autocomplete="off"
            />
          </div>
          <div class="category-filters" id="category-filters"></div>
          <div class="example-list" id="example-list"></div>
        </aside>
        <section class="lesson-panel" aria-label="Selected algorithm lesson">
          <div class="lesson-context">
            <div>
              <p class="lesson-category" id="lesson-category"></p>
              <h2 class="lesson-title" id="lesson-title"></h2>
              <p class="lesson-description" id="lesson-description"></p>
            </div>
            <div class="complexity-group" aria-label="Algorithm complexity">
              <span class="complexity-badge" id="time-complexity"></span>
              <span class="complexity-badge" id="space-complexity"></span>
            </div>
          </div>
          <ts-teaching-debugger id="debugger"></ts-teaching-debugger>
        </section>
      </div>
    </main>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
